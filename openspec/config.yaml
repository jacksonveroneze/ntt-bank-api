# openspec/config.yaml (ntt-bank-api)
# Só processo do OpenSpec. Regras de repo, produto e código ficam em
# AGENTS.md, specs/constitution.md e dotnet-conventions.md.
# Mantenha curto: tudo aqui entra no contexto do agente.
# Itens de lista entre aspas simples: o ": " dentro de texto puro vira mapa no YAML.

context: |
  Leia AGENTS.md, specs/constitution.md (CONST-nnn) e dotnet-conventions.md (CONV-nnn)
  antes de propor. Nenhum artefato pode contrariá-los; cite por ID, sem copiar o texto.
  Item "a definir" ou conflito com regra: registre como pergunta e pare; não deduza.
  Artefatos em português; identificadores de código em inglês.
  CA é um cenário Dado/Quando/Então de um requisito, com dado sintético (CONST-004).
  Spec de endpoint traz o contrato HTTP (envelope ou objeto, corpo de erro, serialização
  de enums, versão na URL, códigos 400/401/403/404, política de id) e os limites dos dados
  (mínimo e máximo, formato). O que faltar vira "a definir"; não assuma.
  A spec nomeia os tipos (enums e value objects) e os códigos de erro (Tipo.Motivo, CONV-021).
  Todo código de produção e de teste é escrito SOMENTE seguindo as skills de skills/net (template, regras e harness)
  do ia-dev-kit: create-value-object, create-entity, create-efcore-repository,
  create-read-use-case, create-mapper, create-endpoint, write-dotnet-tests.
  Nunca escreva esse código à mão.

rules:
  proposal:
    - 'Máximo 400 palavras e uma seção "Fora de escopo".'
    - 'Liste os pré-requisitos de ambiente (ferramentas, pacotes de teste, connection string de CI) e como a funcionalidade será provada ponta a ponta (migration, seed).'
    - 'Confirme se build, test e format estão verdes na main antes de planejar; se não estiverem, registre como pré-requisito.'
  tasks:
    - 'Antes de escrever o tasks.md, leia o SKILL.md, as pré-condições (prerequisites.md) e as references de cada skill citada. Para cada task [Skill], registre no design.md o que falta no repo para a skill rodar (enums, helpers, policy, pastas, catálogo de operações) e planeje isso como task [Manual] anterior.'
    - 'Conflito entre a spec e o contrato de uma skill (status HTTP, tipo do id, operações geradas, pasta do agregado): registre como item a definir e pare. Não contorne com task [Manual].'
    - 'Toda task começa com "[Skill: <nome>]" ou "[Manual]".'
    - 'Task [Skill] lista os inputs que a skill exige (agregado, operação, campos, namespace, tipo do id), no formato pronto para o usuário colar no comando da skill.'
    - 'Liste no design.md os arquivos que já existem e que as skills tratam como pré-requisito (por exemplo, IUseCase e DataResponse). Nenhuma task pode reescrevê-los.'
    - 'Task [Manual] só para a lista fechada (mapeamento EF e schema do DbContext, DI e ligações do Program.cs, migration, enums, helpers da Api, policy de autorização). Justifique em uma linha. Item fora da lista: pergunte antes de planejar.'
    - 'create-read-use-case já gera o mapper e os testes do use case: não planeje create-mapper nem write-dotnet-tests para o mesmo use case.'
    - 'Task dispensada: remova-a do tasks.md e registre o motivo no design.md. Não deixe caixa aberta.'
    - 'Ordem de dependência: Domain, Application (porta e repositório), use case, mapper, Api, testes.'
    - 'Todo CA tem task de teste que o cita (CONST-003).'
    - 'Cada task cabe em um PR pequeno (CONST-007).'

operations:
  apply:
    guidance:
      - 'Task [Skill]: carregue a skill pela ferramenta Skill e siga à risca o template, as regras e o harness dela. Quem escreve o código é você, mas a estrutura vem da skill; não improvise. Todo conteúdo que o template não cobre (validações, casos de teste, códigos de erro, conversões) precisa ter origem na spec ou no design.md; se não tiver, pare e pergunte, não decida.'
      - 'Depois da skill, rode git status e confirme que só os arquivos previstos mudaram e que nenhum arquivo preexistente foi sobrescrito. Divergência: pare e reporte.'
      - 'Se a skill parar por pré-requisito ausente: pare e reporte; não crie o que falta fora de uma task [Manual].'
      - 'Execute as tasks em sequência, na ordem do tasks.md, sem pedir aprovação entre elas. Só pare diante de bloqueio: pré-requisito ausente, conflito spec x skill, git status divergente ou build, test ou format falhando sem correção por skill ou task [Manual].'
      - 'Código gerado com a skill só se corrige pela própria skill (template e harness) ou por task [Manual] explícita; nunca ajuste em silêncio.'
      - 'Ao concluir uma task [Skill], cole no tasks.md o relatório de conformidade: arquivos criados, itens do harness da skill atendidos e cada trecho fora do template com a origem na spec. O relatório é seu, não da skill; sem ele a task não está concluída.'
      - 'Antes de marcar concluída, rode build, test e format (comandos do AGENTS.md) e registre o que rodou.'
  archive:
    guidance:
      - 'Só arquive após verify sem pendências e build, test e format verdes, e com o relatório da skill em toda task [Skill].'
      - 'Resuma o entregue e liste as tasks [Manual] executadas.'